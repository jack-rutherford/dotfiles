# =============================================================================
# Window row along the top of the screen.
#
# tmux draws exactly one horizontal strip -- the status line -- and has no
# separate tab bar, so "a row of windows at the top" means moving the status
# line up and letting the window list be the thing that fills it.
# =============================================================================

# -----------------------------------------------------------------------------
# Truecolor
#
# The tmux-256color terminfo entry does not advertise the RGB capability, so
# without this the hex colours below are squashed to the nearest xterm-256
# palette entry -- and the Catppuccin shell prompt loses its exact shades the
# moment it is running inside tmux.
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# -----------------------------------------------------------------------------
# The row itself
# -----------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#181825,fg=#a6adc8"

# Session name, as a badge on the far left.
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[default] "
set -g status-left-length 32

# The tabs. No separator: each tab carries its own padding, so the active one
# reads as a solid block rather than as text with a gap either side.
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#6c7086] #I #[fg=#a6adc8]#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[bg=#cba6f7,fg=#11111b,bold] #I #W#{?window_zoomed_flag, Z,} "

# Windows asking for attention while you are looking at a different one.
setw -g window-status-activity-style "fg=#f9e2af,bold"
setw -g window-status-bell-style     "fg=#f38ba8,bold"

# The right stays deliberately quiet, so the tabs remain what you read.
set -g status-right "#[fg=#6c7086]%a %d %b  %H:%M "
set -g status-right-length 40

set -g mouse on
